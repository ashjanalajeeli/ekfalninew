name: Backend integration tests

on:
  push:
    branches: [main]
  pull_request:
    paths:
      - 'backend/**'
      - '.github/workflows/backend-integration.yml'

permissions:
  contents: read

jobs:
  integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: ekfalni
          POSTGRES_USER: ekfalni
          POSTGRES_PASSWORD: ekfalni
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U ekfalni -d ekfalni"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - name: Apply database migrations
        working-directory: .
        env:
          PGPASSWORD: ekfalni
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-client
          psql -h 127.0.0.1 -U ekfalni -d ekfalni -f backend/sql/001_initial.sql
          psql -h 127.0.0.1 -U ekfalni -d ekfalni -f backend/sql/002_charities_requests_payments_audit.sql
      - run: npm run test:integration
        env:
          DATABASE_URL: postgres://ekfalni:ekfalni@127.0.0.1:5432/ekfalni
          JWT_SECRET: integration-test-secret-change-me
          NODE_ENV: test
